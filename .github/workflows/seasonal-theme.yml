name: Change theme

on:
  schedule:
    - cron: '17 0 * * *'
  push:
    branches: [main]
    paths:
      - README.md
      - .github/profile/**
      - .github/workflows/seasonal-theme.yml
  workflow_dispatch:
    inputs:
      theme:
        description: 'Persistent theme (auto to follow the calendar)'
        type: choice
        required: true
        default: auto
        options:
          - auto
          - new-year
          - epiphany
          - valentines-day
          - spring
          - easter
          - world-music-day
          - summer
          - bastille-day
          - autumn
          - pink-october
          - halloween
          - movember
          - winter
          - christmas

permissions:
  contents: write

concurrency:
  group: profile-theme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the theme engine
        run: node --test .github/profile/theme.test.mjs
      - name: Apply the theme
        env:
          REQUESTED_THEME: ${{ inputs.theme }}
        run: |
          if [ -n "$REQUESTED_THEME" ]; then
            node .github/profile/theme.mjs --theme "$REQUESTED_THEME"
          else
            node .github/profile/theme.mjs
          fi
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/profile/themes.json .github/profile/assets/banner.svg .github/profile/assets/logo.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update profile theme'
            git push
          fi
