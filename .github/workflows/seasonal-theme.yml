name: Seasonal theme

on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:
    inputs:
      theme:
        description: "Force a theme (e.g. spooky-moon). Leave empty to use today's date."
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick theme
        run: |
          if [ -n "${{ github.event.inputs.theme }}" ]; then
            python scripts/pick_theme.py --theme "${{ github.event.inputs.theme }}"
          else
            python scripts/pick_theme.py
          fi

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: seasonal theme for $(date +%F)"
          git push
